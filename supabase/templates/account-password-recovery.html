<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4efe5;color:#283329;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <main style="max-width:520px;margin:0 auto;padding:32px 24px">
      <h1 style="font-size:24px">Reset your Counting Sheep password</h1>
      <p>Enter this code in Counting Sheep to choose a new password:</p>
      <p style="font-size:32px;letter-spacing:6px;font-weight:700">{{ .Token }}</p>
      <p>If you did not request a password reset, you can safely ignore this email.</p>
    </main>
  </body>
</html>
