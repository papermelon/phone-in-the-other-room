# XcodeGen project definition — source of truth for PhoneInTheOtherRoom.xcodeproj.
# Never hand-edit project.pbxproj; edit this file and run `xcodegen generate`.
#
# TestFlight prep status (docs/PLAYBOOKS/testflight-readiness.md §2):
# - Bundle ID root `com.papermelon.countingsheep` is PENDING HUMAN CONFIRMATION.
#   It is permanent after the first App Store Connect upload.
# - DEVELOPMENT_TEAM is intentionally empty until the Apple Developer account is
#   active. Simulator builds work without it; device/archive builds require it.
# - Entitlement files are wired but intentionally empty for build 1 (no HealthKit,
#   no Family Controls). Populate only after portal capabilities exist.
name: PhoneInTheOtherRoom
options:
  bundleIdPrefix: com.papermelon.countingsheep
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    # TODO(human): set the real Apple Developer Team ID before archiving.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  PhoneInTheOtherRoom:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomApp
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papermelon.countingsheep
        PRODUCT_NAME: Counting Sheep
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Counting Sheep
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: Ollie uses nearby-device distance to check whether your iPhone is away from your Apple Watch during a Focus Run.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Counting Sheep reads sleep duration to show how bedtime phone-away habits relate to rest.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomApp/PhoneInTheOtherRoom.entitlements
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: PhoneInTheOtherRoomWatchApp
        embed: true
    postCompileScripts:
      - script: |
          echo "Screen Time reports require Apple-managed FamilyControls/DeviceActivity entitlements before device validation."
        name: Screen Time Entitlement Note
        basedOnDependencyAnalysis: false
  PhoneInTheOtherRoomWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomWatchApp
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papermelon.countingsheep.watchkitapp
        PRODUCT_NAME: Counting Sheep Watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Counting Sheep
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.papermelon.countingsheep
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: Ollie uses nearby-device distance to check whether your iPhone is away during a Focus Run.
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomWatchApp/PhoneInTheOtherRoomWatchApp.entitlements
  PhoneInTheOtherRoomScreenTimeReport:
    # Standalone extension target; NOT embedded in the main app for build 1.
    # Embedding + Family Controls entitlements happen post-TestFlight (ADR-0004, task C5).
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomScreenTimeReport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papermelon.countingsheep.ScreenTimeReport
        PRODUCT_NAME: Counting Sheep Screen Time Report
        INFOPLIST_FILE: PhoneInTheOtherRoomScreenTimeReport/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomScreenTimeReport/PhoneInTheOtherRoomScreenTimeReport.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCREEN_TIME_REPORTS"
  PhoneInTheOtherRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papermelon.countingsheep.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhoneInTheOtherRoom:
    build:
      targets:
        PhoneInTheOtherRoom: all
        PhoneInTheOtherRoomWatchApp: all
        PhoneInTheOtherRoomTests: [test]
    test:
      targets:
        - name: PhoneInTheOtherRoomTests
  PhoneInTheOtherRoomScreenTimeReport:
    build:
      targets:
        PhoneInTheOtherRoomScreenTimeReport: all
