# XcodeGen project definition — source of truth for PhoneInTheOtherRoom.xcodeproj.
# Never hand-edit project.pbxproj; edit this file and run `xcodegen generate`.
#
# TestFlight prep status (docs/PLAYBOOKS/testflight-readiness.md §2):
# - Bundle ID root is `com.ngawangchime.countingsheep`.
#   It is permanent after the first App Store Connect upload.
# - DEVELOPMENT_TEAM is Chime Ngawang's Apple Developer Team ID.
# - Entitlement files are wired but intentionally empty until features that require
#   entitlements are implemented and portal capabilities are ready.
name: PhoneInTheOtherRoom
options:
  bundleIdPrefix: com.ngawangchime.countingsheep
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: 4KZQPZR47B
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.51.0
targets:
  PhoneInTheOtherRoom:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Supabase.xcconfig
      Release: Config/Supabase.release.xcconfig
    info:
      path: PhoneInTheOtherRoomApp/Info.plist
      properties:
        CFBundleDisplayName: Counting Sheep
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        NSNearbyInteractionUsageDescription: Ollie uses nearby-device distance for an optional Night Watch tuck-in check with your Apple Watch.
        NSCameraUsageDescription: Counting Sheep uses your camera to scan the code where your phone will rest.
        NFCReaderUsageDescription: Counting Sheep reads the phone-bed tag you choose so Ollie can confirm where your phone rests.
        NSHealthShareUsageDescription: Counting Sheep reads sleep duration to show how bedtime phone-away habits relate to rest.
        NSSupportsLiveActivities: true
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
        SUPABASE_LIVE_ACTIVITY_PUSH_ENABLED: "$(SUPABASE_LIVE_ACTIVITY_PUSH_ENABLED)"
        UILaunchScreen:
          UIColorName: LaunchBackground
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomApp
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep
        PRODUCT_NAME: Counting Sheep
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomApp/PhoneInTheOtherRoom.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCREEN_TIME_REPORTS"
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomApp/PhoneInTheOtherRoom.debug.entitlements
    dependencies:
      - package: Supabase
      - target: PhoneInTheOtherRoomWatchApp
        embed: true
      - target: PhoneInTheOtherRoomLiveActivity
        embed: true
      - target: PhoneInTheOtherRoomScreenTimeReport
        embed: true
  PhoneInTheOtherRoomWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomWatchApp
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.watchkitapp
        PRODUCT_NAME: Counting Sheep Watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Counting Sheep
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.ngawangchime.countingsheep
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: Ollie uses nearby-device distance for an optional Night Watch tuck-in check with your iPhone.
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomWatchApp/PhoneInTheOtherRoomWatchApp.entitlements
  PhoneInTheOtherRoomLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomLiveActivity
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.liveactivity
        PRODUCT_NAME: Counting Sheep Live Activity
        INFOPLIST_FILE: PhoneInTheOtherRoomLiveActivity/Info.plist
  PhoneInTheOtherRoomScreenTimeReport:
    # Embedded DeviceActivity report extension. Family Controls distribution is assigned
    # to this target and the containing app; both share only scoped Screen Time selections.
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomScreenTimeReport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.ScreenTimeReport
        PRODUCT_NAME: Counting Sheep Screen Time Report
        INFOPLIST_FILE: PhoneInTheOtherRoomScreenTimeReport/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomScreenTimeReport/PhoneInTheOtherRoomScreenTimeReport.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCREEN_TIME_REPORTS"
  PhoneInTheOtherRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhoneInTheOtherRoom:
    build:
      targets:
        PhoneInTheOtherRoom: all
        PhoneInTheOtherRoomWatchApp: all
        PhoneInTheOtherRoomTests: [test]
    test:
      targets:
        - name: PhoneInTheOtherRoomTests
  PhoneInTheOtherRoomScreenTimeReport:
    build:
      targets:
        PhoneInTheOtherRoomScreenTimeReport: all
