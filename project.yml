name: PhoneInTheOtherRoom
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  PhoneInTheOtherRoom:
    type: application
    platform: iOS
    entitlements:
      path: PhoneInTheOtherRoomApp/PhoneInTheOtherRoom.entitlements
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomApp
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: PhoneInTheOtherRoomWatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PhoneInTheOtherRoom
        PRODUCT_NAME: Phone in the Other Room
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Phone in the Other Room
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: Ollie uses nearby-device distance to check whether your iPhone is away from your Apple Watch during a Focus Run.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
  PhoneInTheOtherRoomWatchApp:
    type: application
    platform: watchOS
    entitlements:
      path: PhoneInTheOtherRoomWatchApp/PhoneInTheOtherRoomWatchApp.entitlements
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomWatchApp
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PhoneInTheOtherRoom.watchkitapp
        PRODUCT_NAME: Phone in the Other Room
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Phone in the Other Room
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.PhoneInTheOtherRoom
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: Ollie uses nearby-device distance to check whether your Watch is away from your iPhone during a Focus Run.
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
  PhoneInTheOtherRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PhoneInTheOtherRoomTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhoneInTheOtherRoom:
    build:
      targets:
        PhoneInTheOtherRoom: all
        PhoneInTheOtherRoomTests: [test]
    test:
      targets:
        - name: PhoneInTheOtherRoomTests
  PhoneInTheOtherRoomWatchApp:
    build:
      targets:
        PhoneInTheOtherRoomWatchApp: all
