# XcodeGen project definition — source of truth for PhoneInTheOtherRoom.xcodeproj.
# Never hand-edit project.pbxproj; edit this file and run `xcodegen generate`.
#
# TestFlight prep status (docs/PLAYBOOKS/testflight-readiness.md §2):
# - Bundle ID root is `com.ngawangchime.countingsheep`.
#   It is permanent after the first App Store Connect upload.
# - DEVELOPMENT_TEAM is Chime Ngawang's Apple Developer Team ID.
# - Entitlement files are wired but intentionally empty until features that require
#   entitlements are implemented and portal capabilities are ready.
name: PhoneInTheOtherRoom
options:
  bundleIdPrefix: com.ngawangchime.countingsheep
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: 4KZQPZR47B
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 10
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.51.0
targets:
  PhoneInTheOtherRoom:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Supabase.xcconfig
      Release: Config/Supabase.release.xcconfig
    info:
      path: PhoneInTheOtherRoomApp/Info.plist
      properties:
        CFBundleDisplayName: Counting Sheep
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        NSNearbyInteractionUsageDescription: Ollie uses nearby-device distance for an optional Wind Down tuck-in check with your Apple Watch.
        NSCameraUsageDescription: Counting Sheep uses your camera to scan the code where your phone will rest.
        NFCReaderUsageDescription: Counting Sheep reads the phone-bed tag you choose to start and end Wind Down.
        NSHealthShareUsageDescription: Counting Sheep reads sleep times, duration, and available stages so you can view them alongside your Wind Down history.
        NSHealthUpdateUsageDescription: Counting Sheep does not add or change Apple Health data; it only reads sleep information you choose to share.
        NSSupportsLiveActivities: true
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
        SUPABASE_LIVE_ACTIVITY_PUSH_ENABLED: "$(SUPABASE_LIVE_ACTIVITY_PUSH_ENABLED)"
        SUPABASE_FEEDBACK_ENABLED: "$(SUPABASE_FEEDBACK_ENABLED)"
        UILaunchScreen:
          UIColorName: LaunchBackground
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomApp
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep
        PRODUCT_NAME: Counting Sheep
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomApp/PhoneInTheOtherRoom.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCREEN_TIME_REPORTS"
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomApp/PhoneInTheOtherRoom.debug.entitlements
    dependencies:
      - package: Supabase
      - target: PhoneInTheOtherRoomWatchApp
        embed: true
      - target: PhoneInTheOtherRoomLiveActivity
        embed: true
      - target: PhoneInTheOtherRoomScreenTimeReport
        embed: true
      - target: PhoneInTheOtherRoomDeviceActivityMonitor
        embed: true
      - target: PhoneInTheOtherRoomShieldConfiguration
        embed: true
      - target: PhoneInTheOtherRoomShieldAction
        embed: true
  PhoneInTheOtherRoomWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomWatchApp
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.watchkitapp
        PRODUCT_NAME: Counting Sheep Watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Counting Sheep
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.ngawangchime.countingsheep
        INFOPLIST_KEY_NSNearbyInteractionUsageDescription: Ollie uses nearby-device distance for an optional Wind Down tuck-in check with your iPhone.
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomWatchApp/PhoneInTheOtherRoomWatchApp.entitlements
  PhoneInTheOtherRoomLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomLiveActivity
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.liveactivity
        PRODUCT_NAME: Counting Sheep Live Activity
        INFOPLIST_FILE: PhoneInTheOtherRoomLiveActivity/Info.plist
  PhoneInTheOtherRoomScreenTimeReport:
    # Embedded DeviceActivity report extension. Family Controls distribution is assigned
    # to this target and the containing app; both share only scoped Screen Time selections.
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomScreenTimeReport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.ScreenTimeReport
        PRODUCT_NAME: Counting Sheep Screen Time Report
        INFOPLIST_FILE: PhoneInTheOtherRoomScreenTimeReport/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomScreenTimeReport/PhoneInTheOtherRoomScreenTimeReport.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCREEN_TIME_REPORTS"
  PhoneInTheOtherRoomDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: PhoneInTheOtherRoomDeviceActivityMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.DeviceActivityMonitor
        PRODUCT_NAME: Counting Sheep Wind Down Monitor
        INFOPLIST_FILE: PhoneInTheOtherRoomDeviceActivityMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomDeviceActivityMonitor/PhoneInTheOtherRoomDeviceActivityMonitor.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCREEN_TIME_REPORTS"
  PhoneInTheOtherRoomShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: PhoneInTheOtherRoomShieldConfiguration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.ShieldConfiguration
        PRODUCT_NAME: Counting Sheep Wind Down Shield
        INFOPLIST_FILE: PhoneInTheOtherRoomShieldConfiguration/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomShieldConfiguration/PhoneInTheOtherRoomShieldConfiguration.entitlements
  PhoneInTheOtherRoomShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: PhoneInTheOtherRoomShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.ShieldAction
        PRODUCT_NAME: Counting Sheep Wind Down Action
        INFOPLIST_FILE: PhoneInTheOtherRoomShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhoneInTheOtherRoomShieldAction/PhoneInTheOtherRoomShieldAction.entitlements
  PhoneInTheOtherRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Shared
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngawangchime.countingsheep.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhoneInTheOtherRoom:
    build:
      targets:
        PhoneInTheOtherRoom: all
        PhoneInTheOtherRoomWatchApp: all
        PhoneInTheOtherRoomTests: [test]
    test:
      targets:
        - name: PhoneInTheOtherRoomTests
  PhoneInTheOtherRoomScreenTimeReport:
    build:
      targets:
        PhoneInTheOtherRoomScreenTimeReport: all
