  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;shepherd-motion-study&#x27;);
  const state = {head:&#x27;B&#x27;,hair:&#x27;short&#x27;,outfit:&#x27;coat&#x27;,skin:&#x27;warm&#x27;,hat:false,direction:&#x27;quarter&#x27;,left:false,texture:true,walking:false,idling:false,phase:0};
  const tones={porcelain:&#x27;#edbd98&#x27;,warm:&#x27;#dca064&#x27;,olive:&#x27;#b68150&#x27;,brown:&#x27;#94603e&#x27;,deep:&#x27;#65412f&#x27;};
  const colors={hair:&#x27;#60364f&#x27;,ink:&#x27;#54334b&#x27;,cream:&#x27;#f3e5bb&#x27;,green:&#x27;#747c46&#x27;,berry:&#x27;#a85461&#x27;,trousers:&#x27;#aa644d&#x27;,boots:&#x27;#59384b&#x27;,hat:&#x27;#cda04d&#x27;};
  const directions=[&#x27;front&#x27;,&#x27;quarter&#x27;,&#x27;side&#x27;,&#x27;rear&#x27;,&#x27;back&#x27;];
  const names={front:&#x27;Front&#x27;,quarter:&#x27;Three-quarter&#x27;,side:&#x27;Side&#x27;,rear:&#x27;Back three-quarter&#x27;,back:&#x27;Back&#x27;};
  const renderers=[...root.querySelectorAll(&#x27;[data-render]&#x27;)];
  const reduced=window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
  let raf=0, last=0;
  function path(d,fill,extra=&#x27;&#x27;){ return `&lt;path d=&quot;${d}&quot; fill=&quot;${fill}&quot; ${extra}/&gt;`; }
  function ellipse(cx,cy,rx,ry,fill,extra=&#x27;&#x27;){return `&lt;ellipse cx=&quot;${cx}&quot; cy=&quot;${cy}&quot; rx=&quot;${rx}&quot; ry=&quot;${ry}&quot; fill=&quot;${fill}&quot; ${extra}/&gt;`;}
  function line(d,width=2.4){return path(d,&#x27;none&#x27;,`stroke=&quot;${colors.ink}&quot; stroke-width=&quot;${width}&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;`);}
  function picture(id){
    const c=colors, skin=tones[state.skin], side=state.direction===&#x27;side&#x27;, rear=state.direction===&#x27;rear&#x27;, back=state.direction===&#x27;back&#x27;, away=rear||back;
    const quarter=state.direction===&#x27;quarter&#x27;, round=state.head===&#x27;C&#x27;, slim=side?0.69:rear?0.89:1;
    const stride=Math.sin(state.phase), bounce=state.walking?Math.abs(Math.sin(state.phase))*1.5:0;

    const torso=state.outfit===&#x27;coat&#x27;?c.green:state.outfit===&#x27;dress&#x27;?c.berry:c.cream;
    const trousers=state.outfit===&#x27;dress&#x27;?skin:c.trousers;
    const leg=(x,rotation)=&gt;`&lt;g data-part=&quot;leg&quot; transform=&quot;rotate(${rotation} ${x} 218)&quot;&gt;${path(`M${x-9} 209 L${x+10} 209 L${x+9} 251 Q${x} 257 ${x-9} 251Z`,trousers)}${path(`M${x-10} 245 Q${x} 247 ${x+10} 245 L${x+10} 256 Q${x+24} 257 ${x+22} 265 Q${x+4} 269 ${x-11} 264Z`,c.boots)}&lt;/g&gt;`;
    const arm=(x,rotation)=&gt;`&lt;g data-part=&quot;arm&quot; transform=&quot;rotate(${rotation} ${x} 174)&quot;&gt;${path(`M${x-10} 170 Q${x} 164 ${x+10} 173 L${x+13} 207 L${x-7} 211Z`,torso)}${path(`M${x-6} 204 L${x+12} 202 Q${x+18} 224 ${x+6} 228 Q${x-5} 228 ${x-6} 216Z`,skin)}&lt;/g&gt;`;
    let body=&#x27;&#x27;;
    if(state.hair===&#x27;long&#x27;) body+=path(&#x27;M59 85 Q52 130 58 199 Q75 214 92 206 L159 205 Q186 211 185 185 L174 88Z&#x27;,c.hair,&#x27;data-part=&quot;back-hair&quot;&#x27;);
    body+=path(&#x27;M111 146 L134 146 L134 174 Q123 181 111 174Z&#x27;,skin,&#x27;data-part=&quot;neck&quot;&#x27;);
    body+=`&lt;g transform=&quot;translate(120 0) scale(${slim} 1) translate(-120 0)&quot;&gt;`;
    body+=leg(side?114:104,angle)+leg(side?126:139,-angle);
    body+=arm(84,-armAngle);
    body+=state.outfit===&#x27;shirt&#x27;?path(&#x27;M97 164 Q120 155 144 165 L158 204 Q126 212 84 205Z&#x27;,torso):path(`M98 162 Q121 156 144 164 L${state.outfit===&#x27;dress&#x27;?164:158} ${state.outfit===&#x27;dress&#x27;?232:228} Q122 236 79 229Z`,torso);
    if(!away){
      body+=path(&#x27;M105 160 L121 164 Q118 183 105 179 Q96 176 98 167Z&#x27;,c.cream)+path(&#x27;M122 164 L139 161 Q147 176 136 180 Q124 183 122 164Z&#x27;,c.cream);
      if(state.outfit===&#x27;coat&#x27;){

    let head=&#x27;&#x27;;
    const headShape=round?&#x27;M49 90 C44 49 77 37 122 39 C171 36 195 62 192 101 C194 137 164 158 121 157 C78 160 46 135 49 90Z&#x27;:state.direction===&#x27;front&#x27;?&#x27;M65 85 C65 53 85 33 119 33 C154 33 175 57 180 89 C191 134 160 160 120 157 C76 158 51 130 65 85Z&#x27;:&#x27;M66 87 C65 57 86 35 117 34 C156 32 174 59 178 88 L181 98 Q197 95 197 106 Q197 115 183 114 C178 146 148 160 115 155 C77 154 56 130 60 104Z&#x27;;
    head+=`&lt;g data-part=&quot;head&quot; transform=&quot;translate(${headX} ${-bounce}) rotate(${headRot} 120 153) translate(120 0) scale(${slim} 1) translate(-120 0)&quot;&gt;`;

    if(!away) head+=ellipse(round?49:63,109,15,19,skin);
    if(away){
      head+=path(round?&#x27;M48 104 C39 46 85 32 125 37 C174 35 201 68 190 125 Q178 150 150 155 L93 157 Q55 145 48 104Z&#x27;:&#x27;M64 110 C51 47 96 23 132 35 Q178 39 182 91 L176 135 Q150 161 104 152 Q69 145 64 110Z&#x27;,c.hair);
      if(state.hair===&#x27;long&#x27;) head+=path(&#x27;M52 101 Q47 155 62 190 Q115 207 183 190 Q193 154 185 96Z&#x27;,c.hair);
      if(rear) head+=ellipse(178,115,9,14,skin);
    } else {
      const hairShape=round?&#x27;M49 90 C41 45 81 30 124 36 C167 30 197 57 192 86 Q179 82 173 70 Q157 91 140 73 Q124 90 107 72 Q89 92 71 76 L55 96Z&#x27;:&#x27;M63 91 C54 48 86 30 124 34 Q162 25 178 64 Q157 58 153 49 Q129 73 92 83 L70 105Z&#x27;;
      head+=path(hairShape,c.hair);
      if(state.head===&#x27;B&#x27;&amp;&amp;!state.hat) head+=path(&#x27;M147 45 Q148 21 158 27 Q165 15 171 31 Q178 45 161 52Z&#x27;,c.hair);
      if(state.hair===&#x27;long&#x27;) head+=path(&#x27;M53 93 Q61 86 68 90 L70 173 Q58 170 57 156Z&#x27;,c.hair)+path(&#x27;M177 89 Q188 85 190 96 L183 174 Q172 170 174 154Z&#x27;,c.hair);
      const eyeX=side?[161]:quarter?[128,164]:[102,146];
      let eyes=&#x27;&#x27;;
      for(const ex of eyeX){
        eyes+=ellipse(ex,106,round?12:11,round?19:22,c.cream);
        eyes+=ellipse(ex+(quarter||side?5:2),108,5.5,10.2,c.ink);
        if(!round) eyes+=line(`M${ex-13} 96 L${ex+13} 96`,2.8);
      }
      const blink=state.idling&amp;&amp;state.phase%36&gt;33&amp;&amp;state.phase%36&lt;34.4?.08:1;
      head+=`&lt;g data-part=&quot;eyes&quot; transform=&quot;translate(0 106) scale(1 ${blink}) translate(0 -106)&quot;&gt;${eyes}&lt;/g&gt;`;
      if(round&amp;&amp;!side) head+=ellipse(quarter?146:124,125,8,7.8,&#x27;none&#x27;,`stroke=&quot;${c.ink}&quot; stroke-width=&quot;2.2&quot;`);
      if(!round&amp;&amp;state.direction===&#x27;front&#x27;) head+=line(&#x27;M124 119 L129 126 L123 128&#x27;,2);
      if(side&amp;&amp;round) head+=path(&#x27;M189 115 Q206 113 203 123 Q199 129 190 125Z&#x27;,skin);
      head+=line(round?`M${quarter?138:115} 144 Q${quarter?147:124} 145 ${quarter?154:132} 143`:`M${quarter?137:115} 139 Q${quarter?145:123} 145 ${quarter?153:131} 139`,2.2);
    }
    if(state.hat){
      const x=round?45:61, width=round?151:126;
      head+=path(`M${x} 75 Q${x+4} 18 ${x+width*.51} 21 Q${x+width-4} 22 ${x+width} 77Z`,c.hat);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {

      })

        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }

    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };

    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {

      }

    if (pinnedByTouch) {
      return;
    }

    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {

    }

    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };

    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;

  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;

      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));

    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;

      next = tabs.length - 1;
    } else {
      return;

    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);

      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
